<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Las noticias más relevantes de Argentina leídas, analizadas, categorizadas y resumidas por Inteligencia Artificial en tiempo real.">
    <meta property="og:title" content="Noticias IA — La información al instante">
    <meta property="og:description" content="Las noticias más relevantes de Argentina leídas, analizadas, categorizadas y resumidas por Inteligencia Artificial en tiempo real.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_AR">
    <title>Noticias IA 📰🤖</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0e16'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='58' font-weight='800' fill='%23f5b942' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo" aria-label="Noticias IA">
                <i class="fa-solid fa-robot" style="color: var(--accent-color);"></i>
            </a>
            <nav>
                <a href="#noticias">Noticias</a>
                <a href="#contacto">Contacto</a>
                <div id="auth-container">
                    <button id="login-btn" class="auth-btn" style="display:none">
                        <i class="fa-solid fa-user"></i> Iniciar sesión
                    </button>
                    <div id="user-info" style="display:none">
                        <img id="user-avatar" alt="" referrerpolicy="no-referrer">
                        <span id="user-name"></span>
                        <button id="logout-btn" class="auth-btn" title="Cerrar sesión">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero" id="noticias">
            <h1>La información resumida por IA</h1>
        </section>

        <h2 class="sr-only">Últimas noticias</h2>

        <!-- Búsqueda -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Buscar por palabra, nombre o lugar...">
        </div>

        <!-- Filtros de categoría -->
        <div class="filters-container" id="category-filters">
            <button class="filter-btn active" data-filter="all"><i class="fa-solid fa-layer-group"></i> Todas</button>
            <button class="filter-btn" data-filter="politica"><i class="fa-solid fa-landmark"></i> Política</button>
            <button class="filter-btn" data-filter="economia"><i class="fa-solid fa-chart-line"></i> Economía</button>
            <button class="filter-btn" data-filter="deportes"><i class="fa-solid fa-futbol"></i> Deportes</button>
            <button class="filter-btn" data-filter="espectaculos"><i class="fa-solid fa-star"></i> Espectáculos</button>
            <button class="filter-btn" data-filter="tecnologia"><i class="fa-solid fa-microchip"></i> Tecnología</button>
            <button class="filter-btn" data-filter="salud"><i class="fa-solid fa-heart-pulse"></i> Salud</button>
            <button class="filter-btn" data-filter="sociedad"><i class="fa-solid fa-people-group"></i> Sociedad</button>
            <button class="filter-btn" data-filter="general"><i class="fa-solid fa-newspaper"></i> General</button>
        </div>

        <!-- Filtro por diario (se completa dinámicamente según las noticias cargadas) -->
        <div class="filters-container" id="diario-filters">
            <button class="filter-btn active" data-diario-filter="all"><i class="fa-solid fa-newspaper"></i> Todos los diarios</button>
        </div>

        <!-- Filtro por estado de lectura -->
        <div class="filters-container" id="read-filters">
            <button class="filter-btn" data-read-filter="all"><i class="fa-solid fa-layer-group"></i> Todas</button>
            <button class="filter-btn active" data-read-filter="unread"><i class="fa-regular fa-circle"></i> No leídas</button>
            <button class="filter-btn" data-read-filter="read"><i class="fa-solid fa-check"></i> Leídas</button>
        </div>

        <!-- Contenedor de Noticias -->
        <div class="news-grid" id="news-container">
            <!-- Skeleton Loaders (Se muestran mientras cargan los datos) -->
            <div class="news-card">
                <div class="card-header">
                    <div class="badges-wrapper">
                        <div class="skeleton" style="width: 70px; height: 26px; border-radius: 20px;"></div>
                        <div class="skeleton" style="width: 80px; height: 26px; border-radius: 6px;"></div>
                    </div>
                    <div class="skeleton" style="width: 80px; height: 16px;"></div>
                </div>
                <div class="skeleton" style="width: 100%; height: 26px; margin-bottom: 0.8rem;"></div>
                <div class="skeleton" style="width: 70%; height: 26px; margin-bottom: 1.5rem;"></div>
                <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 90%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 95%; height: 16px; margin-bottom: 2rem;"></div>
            </div>
            <!-- Repetimos dos skeletons más para simular la grilla cargando -->
            <div class="news-card">
                <div class="card-header">
                    <div class="badges-wrapper">
                        <div class="skeleton" style="width: 70px; height: 26px; border-radius: 20px;"></div>
                        <div class="skeleton" style="width: 80px; height: 26px; border-radius: 6px;"></div>
                    </div>
                    <div class="skeleton" style="width: 80px; height: 16px;"></div>
                </div>
                <div class="skeleton" style="width: 100%; height: 26px; margin-bottom: 0.8rem;"></div>
                <div class="skeleton" style="width: 70%; height: 26px; margin-bottom: 1.5rem;"></div>
                <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 90%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 95%; height: 16px; margin-bottom: 2rem;"></div>
            </div>
            <div class="news-card">
                <div class="card-header">
                    <div class="badges-wrapper">
                        <div class="skeleton" style="width: 70px; height: 26px; border-radius: 20px;"></div>
                        <div class="skeleton" style="width: 80px; height: 26px; border-radius: 6px;"></div>
                    </div>
                    <div class="skeleton" style="width: 80px; height: 16px;"></div>
                </div>
                <div class="skeleton" style="width: 100%; height: 26px; margin-bottom: 0.8rem;"></div>
                <div class="skeleton" style="width: 70%; height: 26px; margin-bottom: 1.5rem;"></div>
                <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 90%; height: 16px; margin-bottom: 0.6rem;"></div>
                <div class="skeleton" style="width: 95%; height: 16px; margin-bottom: 2rem;"></div>
            </div>
        </div>

        <!-- Cargar más -->
        <div class="load-more-container">
            <button id="load-more-btn" class="btn-load-more" style="display:none">
                <i class="fa-solid fa-chevron-down"></i> Cargar más noticias
            </button>
            <p id="no-more-msg" class="no-more-msg" style="display:none">Ya viste todas las noticias disponibles.</p>
        </div>
    </main>

    <!-- Sección de Contacto -->
    <section class="contact-section" id="contacto">
        <div class="container contact-container">
            <h2 class="sr-only">Contacto</h2>

            <div class="contact-info">
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/ignacio-lo-sasso/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-linkedin"></i>
                        <span>Conectá conmigo en LinkedIn</span>
                    </a>
                    
                    <a href="mailto:nacholosasso@hotmail.com" class="social-btn">
                        <i class="fa-solid fa-envelope"></i>
                        <span>nacholosasso@hotmail.com</span>
                    </a>
                </div>
            </div>

            <!-- Formulario hacia Formspree -->
            <div class="contact-form-wrapper">
                <form class="contact-form" action="https://formspree.io/f/mqewjeya" method="POST">
                    <div class="form-group">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Tu nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message" class="form-control" placeholder="¿En qué puedo ayudarte?" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Enviar Mensaje <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>
    </section>

    <!-- Modal de login / registro -->
    <div id="auth-modal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <button type="button" id="auth-modal-close" class="modal-close" aria-label="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-auth-tab="signin">Entrar</button>
                <button type="button" class="auth-tab" data-auth-tab="signup">Crear cuenta</button>
            </div>

            <button type="button" id="google-signin-btn" class="auth-btn auth-btn-google">
                <i class="fa-brands fa-google"></i> Continuar con Google
            </button>

            <div class="auth-divider"><span>o</span></div>

            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" class="form-control" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="auth-password">Contraseña</label>
                    <input type="password" id="auth-password" class="form-control" required autocomplete="current-password" minlength="6">
                </div>
                <p id="auth-error" class="auth-error" style="display:none"></p>
                <p id="auth-info" class="auth-info" style="display:none"></p>
                <button type="submit" id="auth-submit-btn" class="btn-submit">Entrar</button>
            </form>

            <button type="button" id="auth-forgot-btn" class="auth-link-btn">¿Olvidaste tu contraseña?</button>
        </div>
    </div>

    <footer>
        <div class="container footer-content">
            <p>Ignacio Lo Sasso. Todos los derechos reservados.</p>
            <p class="footer-tech"><a href="https://github.com/nacholosasso/noticias-ia" target="_blank" rel="noopener noreferrer">Ver en GitHub</a></p>
        </div>
    </footer>

    <script src="app.js"></script>

    <!-- Firebase SDK modular (Reservado en Firebase Hosting) -->
    <!-- No necesitas configurar credenciales aquí; si haces firebase deploy, Firebase se encarga mágicamente -->
    <script type="module" src="firebase-loader.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
